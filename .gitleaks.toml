# gitleaks configuration for AgentProbe.
# Extends the upstream default rule set, then adds repo-specific allowlisting so
# that example placeholders and synthetic demo data do not trip the scanner.

[extend]
useDefault = true

[allowlist]
description = "Allow committed example placeholders and synthetic demo data"
# Only the example env file is allowlisted by path. Test files are deliberately
# NOT path-allowlisted: a real key pasted into a test should still be caught. The
# fake-token regex below covers the obviously-synthetic tokens tests use.
paths = [
  '''\.env\.example$''',
  '''examples/reference-agent/cassettes/.*\.json$''',
]
regexes = [
  # placeholder keys in the example env file
  '''ANTHROPIC_API_KEY=$''',
  '''AGENT_BEARER_TOKEN=$''',
  # obviously fake tokens used in tests and seeded cassettes
  '''(?i)(test|fake|mock|dummy|example|redacted)[-_]?(token|key|secret)''',
]
